name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - run: python -m pip install -r requirements-dev.txt
    - name: Undefined-name checks
      run: python -m ruff check .
    - name: Domain and boundary lint
      run: python -m ruff check domain entities.py unit_orders/__init__.py unit_orders/registry.py unit_components/__init__.py display_config.py application_bootstrap.py turn_presentation.py game_actions/turn_presentation.py scripts/check_import_boundaries.py --select F,E9
    - name: Core dependency direction
      run: python scripts/check_import_boundaries.py
    - name: Typed boundary contracts
      run: python -m mypy
    - name: Generated reference consistency
      run: python scripts/generate_reference.py --check

  test:
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.14"]
        include:
        - os: windows-latest
          python-version: "3.14"

    env:
      SDL_VIDEODRIVER: "dummy"
      SDL_AUDIODRIVER: "dummy"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run test suite
      run: python -m pytest
